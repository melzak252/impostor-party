volumes:
  impostor_data:

networks:
  impostor:
    driver: bridge

services:
  impostor-party:
    container_name: impostor-party
    image: ${IMPOSTOR_IMAGE:-ghcr.io/melzak252/impostor-party:latest}
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - impostor
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be set, e.g. https://party.example.com}
      DATABASE_PATH: /data/impostor.sqlite
    volumes:
      - impostor_data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
